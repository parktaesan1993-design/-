<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>카우리테이블 직원용</title>
<style>
:root{--bg:#F6F1E8;--surface:#FFFCF6;--line:#E2D7C4;--fg:#2A2118;--muted:#6B5D4C;--wood:#8A5A2E;--forest:#2F5A46;--forest-soft:#E3ECE5;--bad:#A2412B;--bad-soft:#F7E3DC;--warn:#7A5A10;--warn-soft:#F6EBC9;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 48px max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;font-weight:600}
input,select{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--fg)}
#code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;border:none;border-radius:10px;background:var(--forest);color:#fff;font-weight:600;font-size:16px;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px}
.tabs button.on{background:var(--fg);color:#fff;border-color:var(--fg);font-weight:600}
.result{border-radius:10px;padding:14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.result b{font-size:18px}
.valid{background:var(--forest-soft);color:var(--forest)} .used,.none{background:var(--bad-soft);color:var(--bad)} .expired{background:var(--warn-soft);color:var(--warn)}
.msg{font-size:14px;min-height:1.2em;margin:0} .msg.err{color:var(--bad)} .msg.ok{color:var(--forest)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
li.hid{opacity:.55;border-style:dashed}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.t{white-space:pre-wrap;overflow-wrap:anywhere}
li button{align-self:flex-start;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;min-height:36px}
.confirm{display:flex;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>카우리테이블 직원용</h1><p class="sub" id="storeLine"></p></div>

  <form class="card" id="loginBox">
    <label for="pin">관리자 PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn" type="submit">들어가기</button>
    <p class="msg err" id="loginMsg" role="status"></p>
  </form>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="coupon">쿠폰 확인</button>
      <button type="button" data-tab="comments">댓글 관리</button>
      <button type="button" data-tab="stats">현황</button>
    </div>

    <form class="card" id="tab-coupon">
      <label for="code">고객 쿠폰 번호</label>
      <input id="code" placeholder="KT-XXXXXX" autocomplete="off" autocapitalize="characters">
      <button class="btn ghost" type="submit">확인하기</button>
      <div id="result"></div>
      <div id="redeemArea" hidden style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" type="button" id="redeemBtn">사용 처리하기</button>
        <div class="confirm" id="confirmRow" hidden>
          <button class="btn danger" type="button" id="confirmYes">네, 사용 처리</button>
          <button class="btn ghost" type="button" id="confirmNo">취소</button>
        </div>
      </div>
      <p class="msg" id="couponMsg" role="status"></p>
    </form>

    <div id="tab-comments" hidden style="display:flex;flex-direction:column;gap:10px">
      <p class="sub">숨김 처리한 댓글은 고객 화면에서 보이지 않아요. 언제든 다시 보이게 할 수 있어요.</p>
      <ul id="cList"></ul>
    </div>

    <div id="tab-stats" hidden class="stats"></div>

    <button class="btn ghost" type="button" id="logout">나가기</button>
  </div>
</div>
<script>
(function () {
  const STORES = { gwanghwamun: "광화문점", gangnam: "강남점", jamsil: "잠실점" };
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const STORE = STORES[qs.get("store")] ? qs.get("store") : "gwanghwamun";
  $("storeLine").textContent = "교보문고 " + STORES[STORE] + " · 쿠폰 확인과 댓글 관리";
  let pin = ""; try { pin = sessionStorage.getItem("kauri-pin") || ""; } catch {}

  async function admin(action, extra) {
    const r = await fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin, action, store: STORE, ...extra }) });
    let d = {}; try { d = await r.json(); } catch {}
    if (!r.ok && !d.status) throw new Error(d.error || "연결이 원활하지 않아요.");
    return d;
  }
  const fmt = (iso) => { if (!iso) return "-"; const d = new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

  function enter() { $("loginBox").hidden = true; $("app").hidden = false; $("code").focus(); }
  $("loginBox").addEventListener("submit", async (e) => {
    e.preventDefault(); pin = $("pin").value.trim(); $("loginMsg").textContent = "";
    try { await admin("login"); try { sessionStorage.setItem("kauri-pin", pin); } catch {} enter(); }
    catch (err) { $("loginMsg").textContent = err.message; }
  });
  if (pin) admin("login").then(enter).catch(() => { pin = ""; });
  $("logout").onclick = () => { try { sessionStorage.removeItem("kauri-pin"); } catch {} location.reload(); };

  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    ["coupon", "comments", "stats"].forEach((t) => ($("tab-" + t).hidden = t !== b.dataset.tab));
    if (b.dataset.tab === "comments") loadComments();
    if (b.dataset.tab === "stats") loadStats();
  });

  /* 쿠폰 */
  const LABEL = { valid: "사용 가능한 쿠폰", used: "이미 사용한 쿠폰", expired: "기한이 지난 쿠폰", none: "없는 쿠폰 번호" };
  function showResult(d) {
    const box = $("result"); box.textContent = "";
    const div = document.createElement("div"); div.className = "result " + d.status;
    const b = document.createElement("b"); b.textContent = LABEL[d.status] || d.status; div.appendChild(b);
    if (d.coupon) {
      [["번호", d.coupon.code], ["발급", fmt(d.coupon.issuedAt)], ["기한", fmt(d.coupon.expiresAt) + "까지"], ["사용", d.coupon.usedAt ? fmt(d.coupon.usedAt) : "아직 사용 안 함"]]
        .forEach(([k, v]) => { const s = document.createElement("span"); s.textContent = k + "  " + v; div.appendChild(s); });
    }
    box.appendChild(div);
    $("redeemArea").hidden = d.status !== "valid"; $("confirmRow").hidden = true; $("redeemBtn").hidden = false;
  }
  $("tab-coupon").addEventListener("submit", async (e) => {
    e.preventDefault(); $("couponMsg").textContent = "";
    try { showResult(await admin("check", { code: $("code").value })); } catch (err) { $("couponMsg").className = "msg err"; $("couponMsg").textContent = err.message; }
  });
  $("redeemBtn").onclick = () => { $("redeemBtn").hidden = true; $("confirmRow").hidden = false; };
  $("confirmNo").onclick = () => { $("redeemBtn").hidden = false; $("confirmRow").hidden = true; };
  $("confirmYes").onclick = async () => {
    try { const d = await admin("redeem", { code: $("code").value }); showResult(d); $("couponMsg").className = "msg ok"; $("couponMsg").textContent = d.status === "used" && !d.error ? "사용 처리했어요." : d.error; }
    catch (err) { $("couponMsg").className = "msg err"; $("couponMsg").textContent = err.message; }
  };

  /* 댓글 */
  async function loadComments() {
    const ul = $("cList"); ul.innerHTML = "<li>불러오는 중…</li>";
    try {
      const { comments } = await admin("comments");
      ul.textContent = "";
      if (!comments.length) { ul.innerHTML = "<li>아직 댓글이 없어요.</li>"; return; }
      comments.forEach((c) => {
        const li = document.createElement("li"); if (c.hidden) li.className = "hid";
        const m = document.createElement("div"); m.className = "meta";
        const l = document.createElement("span"); l.textContent = c.nick + " · 공감 " + (c.likes || 0) + (c.hidden ? " · 숨김" : "");
        const r = document.createElement("span"); r.textContent = fmt(c.createdAt); m.append(l, r);
        const t = document.createElement("div"); t.className = "t"; t.textContent = c.text;
        const b = document.createElement("button"); b.type = "button"; b.textContent = c.hidden ? "다시 보이기" : "숨기기";
        b.onclick = async () => { b.disabled = true; try { await admin(c.hidden ? "show" : "hide", { id: c.id }); loadComments(); } catch { b.disabled = false; } };
        li.append(m, t, b); ul.appendChild(li);
      });
    } catch (err) { ul.innerHTML = ""; const li = document.createElement("li"); li.textContent = err.message; ul.appendChild(li); }
  }

  /* 현황 */
  async function loadStats() {
    const box = $("tab-stats"); box.textContent = "";
    try {
      const s = await admin("stats");
      [[s.coupons.issued, "발급한 쿠폰"], [s.coupons.used, "사용한 쿠폰"], [s.comments.total, "남겨진 댓글"], [s.comments.hidden, "숨긴 댓글"]].forEach(([n, l]) => {
        const d = document.createElement("div"); d.className = "stat"; const b = document.createElement("b"); b.textContent = n; const sp = document.createElement("span"); sp.textContent = l; d.append(b, sp); box.appendChild(d);
      });
    } catch (err) { box.textContent = err.message; }
  }
})();
</script>
</body>
</html>
